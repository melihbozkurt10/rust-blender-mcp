# cargo-deny configuration.
#
#     cargo install cargo-deny
#     cargo deny check
#
# This project runs on other people's machines and reaches the network, so the
# dependency tree is worth keeping honest: no unmaintained crates, no surprise
# licences, no duplicate versions accumulating unnoticed, and nothing pulled
# from anywhere but crates.io.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Add an entry here only with a comment saying why the advisory does not apply,
# never merely to make the check pass.
ignore = []

[licenses]
version = 2
# This project is Apache-2.0, and the allowlist below keeps the dependency tree
# permissive to match. A copyleft dependency would change what downstream users
# may do with a crate lifted out of this workspace, so it is refused here rather
# than discovered later.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Things that must never appear in this dependency tree.
deny = [
    # No embedded interpreter. The whole point of the design is that network
    # input cannot become code; a scripting engine in the tree would be a
    # standing invitation to undo that.
    { name = "rlua" },
    { name = "mlua" },
    { name = "rhai" },
    { name = "deno_core" },
    { name = "v8" },
]

# TLS comes from the platform (schannel on Windows, Security.framework on
# macOS, OpenSSL on Linux) rather than a vendored copy, so `openssl-sys` may
# legitimately appear on Linux targets.

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
